{% extends "app.html" %}
{% from "_macros.html" import back %}
{% block title %}{{ _('Code PIN') }} — {{ APP_NAME }}{% endblock %}
{% block content %}
{{ back('main.reglages', _('Réglages')) }}
<div class="page-head"><h1>{{ _('Code PIN') }}</h1></div>

<form method="post" class="card">
  <div class="field-row">
    <label for="current_pin">{{ _('Code actuel') }}</label>
    <input type="password" inputmode="numeric" id="current_pin" name="current_pin" maxlength="8" required>
  </div>
  <div class="field-row">
    <label for="new_pin">{{ _('Nouveau code') }}</label>
    <input type="password" inputmode="numeric" id="new_pin" name="new_pin" maxlength="8" required>
  </div>
  <div class="field-row">
    <label for="confirm_pin">{{ _('Confirmer') }}</label>
    <input type="password" inputmode="numeric" id="confirm_pin" name="confirm_pin" maxlength="8" required>
  </div>

  {% if error %}<p class="error" role="alert">{{ _(error) }}</p>{% endif %}

  <button type="submit" class="btn btn-primary btn-block">{{ _('Mettre à jour') }}</button>
</form>
{% endblock %}
